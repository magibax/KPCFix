# KPCFix for Windows - display configuration
# Renderer: DDrawCompat 0.7.2
# Save beside client.exe as DDrawCompat-CLIENT.ini. Restart after edits.
# Standard preset: 1920x1080 game rendering, HUD150; desktop output follows Windows.

# --- GAME RESOLUTION AND HUD SIZE ---
# Set the ACTIVE game/profile mode to 1920x1080 (1080p).
# A saved profile can override the launcher's selected resolution.
# In KPCFix.ini (not this file), use:
#   [HUD]
#   ScalePercent=150
# This scales the HUD inside the game while its 3D mode stays 1080p.
# Corresponding game-config entries (not DDrawCompat options):
#   "ScreenWidth" "1920"
#   "ScreenHeight" "1080"
# KPCFix.ini controls the input mode.

# --- DISPLAY OUTPUT ---
# Borderless fills the desktop; retain this as the working default.
FullscreenMode = borderless
CompatFixes = nowindowborders

# Output follows the Windows desktop; game rendering is selected separately.
# For fixed 1080p display output instead, use DisplayResolution = 1920x1080.
DisplayResolution = desktop
# Output follows the desktop refresh; VSync below locks rendering to it.
DisplayRefreshRate = desktop

# Preserve proportions and allow 1080p to scale to other desktop sizes.
# For an exact 720p->1440p 2x pixel scale, integer is an optional alternative.
DisplayAspectRatio = app
DisplayFilter = bilinear(0)

# Advertised modes; this list does not select the current game mode.
# 1920x1080 is explicitly advertised even when the desktop is another size.
SupportedResolutions = native, 640x480, 800x600, 1024x768, 1280x720, 1920x1080
DpiAwareness = permonitor

# --- 3D RENDERING RESOLUTION ---
# Use the game's selected native mode. Do not use app(2) for this test.
# The app(2) experiment did not produce the required result in KPC.
# Default: game 1920x1080 + app(1) + KPCFix HUD ScalePercent=150.

# Optional native 1440p: select 2560x1440 in the game and use HUD200.
# Optional 720p: select 1280x720 and use HUD100. Restart after INI edits.
ResolutionScale = app(1)
RenderColorDepth = 32

# --- VSYNC AND FPS LIMIT ---
# Default: VSync on, no separate cap: the game runs at the monitor's refresh
# rate (60, 120, 144, 165 Hz...). KPCFix's timing, movement and AI step fixes
# (Timing V3, Ground V5, LocalServerMinStepMs=16) keep high frame rates safe.
VSync = wait(1)
FpsLimiter = off

# The previous default, a fixed 60 FPS cap with VSync:
#   VSync = wait(1)
#   FpsLimiter = flipend(60)

# Disable the game's VSync wait, retaining borderless:
#   VSync = off
#
# Disable that wait and use a fixed 165 FPS cap:
#   VSync = off
#   FpsLimiter = flipend(165)
# Other cap examples: flipend(60), flipend(120), flipend(200).
# DDrawCompat 0.7.2 accepts integer caps from 10 to 200.
#
# Borderless PRESENTATION remains synchronised even with VSync=off.
# For unrestricted presentation/rendering, change all three:
#   FullscreenMode = exclusive(0)
#   VSync = off
#   FpsLimiter = off
# Exclusive mode may tear; driver VSync overrides still apply.
# NVIDIA G-Sync: for exclusive mode, set "Preferred refresh rate" to
# "Application-controlled" in NVIDIA Control Panel.
# Return to borderless + wait(1) + FpsLimiter off for the current setup.

# --- FPS OVERLAY ---
# Shift+F12 shows/hides it.
# Fliprate: completed game frames/s. Presentrate: queued presentations/s.
StatsHotKey = shift+f12
StatsRows = label, fliprate, presentrate
StatsColumns = label, cur

# --- WORKING MOUSE SETTINGS ---
# Retain these with KPCFix's smooth input correction.
MouseSensitivity = native
MousePollingRate = native

# --- WORKING STUTTER FIXES ---
# Retain this combination, which resolved the reported audio/frame stutter.
CpuAffinity = all
CpuAffinityRotation = off
ThreadPriorityBoost = app

# --- LOGGING ---
# info writes useful diagnostic logs; none disables new logging.
LogLevel = info

# DDrawCompatOverlay-CLIENT.ini overrides matching settings in this file.
# If an edit seems ignored, check that file for a conflicting override.
# KPCFix.ini separately controls our DLL's engine/input/sensitivity fixes.

# Keep HUD art and cursor pixels sharp. KPCFix filters cinematics separately.
BltFilter = point
