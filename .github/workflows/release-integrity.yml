name: Verify and package KPCFix releases

on:
  push:
    branches: [main]
    tags:
      - "kpcfix-v*"
      - "server-tools-v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    if: ${{ !startsWith(github.ref, 'refs/tags/server-tools-v') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify committed files remain unchanged by Git renormalization
        shell: bash
        run: |
          git add --renormalize .
          if ! git diff --cached --quiet; then
            git diff --cached --name-only
            echo 'ERROR: .gitattributes would renormalize tracked files'
            exit 1
          fi
      - name: Verify established client build toolchain
        shell: bash
        run: |
          gcc --version | head -1
          ld --version | head -1
          test "$(gcc -dumpfullversion)" = "13.3.0"
          ld --version | head -1 | grep -F '2.42'
      - name: Reject client release tags outside stable mainline
        if: startsWith(github.ref, 'refs/tags/kpcfix-v')
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo 'ERROR: client release tag is not on stable main history'; exit 1; }
      - name: Reject a client tag that differs from the pinned SemVer
        if: startsWith(github.ref, 'refs/tags/kpcfix-v')
        shell: bash
        run: |
          expected="$(python3 -c 'from tools.package_release import release_version; print(release_version("client"))')"
          test "$GITHUB_REF_NAME" = "kpcfix-v${expected}" || {
            echo "ERROR: tag $GITHUB_REF_NAME does not match pinned client v${expected}"
            exit 1
          }
      - name: Rebuild client from the exact commit
        run: python3 source/build.py --build-dir "${RUNNER_TEMP}/client-build" --output "${RUNNER_TEMP}/client-build/dinput.dll"
      - name: Verify tracked DLL, symbol map and build report
        shell: bash
        run: |
          cmp "${RUNNER_TEMP}/client-build/dinput.dll" dinput.dll
          cmp "${RUNNER_TEMP}/client-build/SYMBOLS.json" source/SYMBOLS.json
          cmp "${RUNNER_TEMP}/client-build/BUILD_RESULT.json" source/BUILD_RESULT.json
      - name: Retrieve pinned DDrawCompat DLL from the prior release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/ddraw-input"
          gh release download kpcfix-v1.1.0 -p KPCFix-Windows-v1.1.0.zip -D "${RUNNER_TEMP}/ddraw-input"
          unzip -p "${RUNNER_TEMP}/ddraw-input/KPCFix-Windows-v1.1.0.zip" ddraw.dll > "${RUNNER_TEMP}/ddraw.dll"
          echo "94895cf6ede8fd0f74ee1447fdc08b7044a9c65a1a25a49a4df893a0370975a3  ${RUNNER_TEMP}/ddraw.dll" | sha256sum -c
      - name: Run packaging tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Verify and assemble client package
        run: python3 tools/package_release.py --component client --ddraw "${RUNNER_TEMP}/ddraw.dll" --output-dir dist/client
      - uses: actions/upload-artifact@v4
        with:
          name: KPCFix-Windows-candidate
          path: dist/client/*
          if-no-files-found: error

  server:
    if: ${{ !startsWith(github.ref, 'refs/tags/kpcfix-v') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify committed files remain unchanged by Git renormalization
        shell: bash
        run: |
          git add --renormalize .
          if ! git diff --cached --quiet; then
            git diff --cached --name-only
            echo 'ERROR: .gitattributes would renormalize tracked files'
            exit 1
          fi
      - name: Block experimental co-op from stable Server Tools and server tags
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          dll = Path('server-tools/KPCServerTools.dll').read_bytes()
          source = Path('server-tools/server-tools-source/src/proxy.c').read_text()
          markers = (b'[KPCFix Co-op]', b'TraceCampaign', b'spawn-list-control-')
          assert not any(m in dll for m in markers), 'Experimental co-op code detected in stable DLL'
          assert '[KPCFix Co-op]' not in source and 'TraceCampaign' not in source, 'Experimental co-op code in stable server source'
          print('PASS: stable server has no experimental co-op markers')
          PY
          if [[ "$GITHUB_REF" == refs/tags/server-tools-v* ]]; then
            git fetch origin main
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
              { echo 'ERROR: stable server tag does not point to main history'; exit 1; }
          fi
      - name: Reject a server tag that differs from the pinned SemVer
        if: startsWith(github.ref, 'refs/tags/server-tools-v')
        shell: bash
        run: |
          expected="$(python3 -c 'from tools.package_release import release_version; print(release_version("server"))')"
          test "$GITHUB_REF_NAME" = "server-tools-v${expected}" || {
            echo "ERROR: tag $GITHUB_REF_NAME does not match pinned Server Tools v${expected}"
            exit 1
          }
      - name: Verify shared client/server source copies
        shell: bash
        run: |
          for name in sha256.c sha256.h winmini.h; do
            cmp "source/src/$name" "server-tools/server-tools-source/src/$name"
          done
          echo 'PASS: shared sources remain byte-identical'
      - name: Rebuild with the beta's Debian GCC 14.2 / binutils 2.44
        shell: bash
        run: |
          cp -a server-tools "${RUNNER_TEMP}/server-tools"
          docker run --rm \
            -v "${RUNNER_TEMP}/server-tools:/work/server-tools" \
            -w /work/server-tools \
            debian:trixie-slim sh -euc '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc binutils python3 ca-certificates
              test "$(gcc -dumpfullversion)" = "14.2.0"
              ld --version | head -1 | grep -F "2.44"
              python3 server-tools-source/build_dll.py
            '
          cmp "${RUNNER_TEMP}/server-tools/KPCServerTools.dll" server-tools/KPCServerTools.dll
          cmp "${RUNNER_TEMP}/server-tools/SERVER_TOOLS_BUILD.json" server-tools/SERVER_TOOLS_BUILD.json
      - name: Run server assembly regression harness (EU and USA)
        shell: bash
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/python" -m pip install 'unicorn==2.1.4'
          "${RUNNER_TEMP}/venv/bin/python" "${RUNNER_TEMP}/server-tools/server-tools-source/tests/run_checks.py"
          "${RUNNER_TEMP}/venv/bin/python" "${RUNNER_TEMP}/server-tools/server-tools-source/tests/run_checks.py" --usa
      - name: Run packaging tests
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Verify and assemble Server Tools package
        run: python3 tools/package_release.py --component server --output-dir dist/server
      - uses: actions/upload-artifact@v4
        with:
          name: KPCFix-Server-Tools-candidate
          path: dist/server/*
          if-no-files-found: error

  launcher-ini-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      # The .cmd wrappers run powershell.exe, so 5.1 is the production parser.
      - name: Parse every tracked PowerShell script in full (Windows PowerShell 5.1)
        shell: powershell
        run: ./tools/Test-PowerShellSyntax.ps1
      - name: Parse every tracked PowerShell script in full (PowerShell 7)
        shell: pwsh
        run: ./tools/Test-PowerShellSyntax.ps1
      - name: Execute real PowerShell launcher INI edit block against temp fixtures
        shell: pwsh
        run: ./tools/Test-KPCServerIni.ps1
      - name: Repeat the launcher INI test under Windows PowerShell 5.1
        shell: powershell
        run: ./tools/Test-KPCServerIni.ps1

  publish-client:
    if: startsWith(github.ref, 'refs/tags/kpcfix-v')
    needs: [client]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KPCFix-Windows-candidate
          path: dist
      - name: Publish matching tagged source and client package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#kpcfix-v}"
          archive="dist/KPCFix-Windows-v${version}.zip"
          gh release create "${GITHUB_REF_NAME}" "${archive}" "${archive}.sha256" \
            --verify-tag --title "KPCFix v${version} (Windows; game 1.13)" \
            --notes 'Built from the exact tagged source after binary reproduction and checksum verification. Follow README.md for installation.'

  publish-server:
    if: startsWith(github.ref, 'refs/tags/server-tools-v')
    needs: [server]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KPCFix-Server-Tools-candidate
          path: dist
      - name: Publish matching tagged source and Server Tools package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#server-tools-v}"
          archive="dist/KPCFix-Server-Tools-v${version}.zip"
          gh release create "${GITHUB_REF_NAME}" "${archive}" "${archive}.sha256" \
            --verify-tag --title "KPCFix Server Tools v${version} (game 1.13)" \
            --notes 'Built from the exact tagged source after binary reproduction and checksum verification. Follow README-Server-Tools.md for installation.'
