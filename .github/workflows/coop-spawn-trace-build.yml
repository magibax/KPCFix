name: Experimental co-op collision query differential test

on:
  push:
    branches:
      - feature/coop-campaign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify build-tool availability
        run: gcc --version && as --version | head -1 && objcopy --version | head -1 && ld -V | head -8
      - name: Build server proxy and refreshed manifest
        run: python3 server-tools/server-tools-source/build_dll.py
      - name: Run asset-free co-op tests
        run: python3 -m unittest discover -s coop/tools -p 'test_*.py' -v
      - name: Run native 3-player spawn slot unit tests
        shell: bash
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -I server-tools/server-tools-source/src \
            server-tools/server-tools-source/tests/test_coop_spawn.c -o /tmp/kpc-coop-spawn-test
          /tmp/kpc-coop-spawn-test
      - name: Verify fail-closed general allocator policy
        shell: bash
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -I server-tools/server-tools-source/src \
            server-tools/server-tools-source/tests/test_coop_allocator.c -o /tmp/kpc-coop-allocator-test
          /tmp/kpc-coop-allocator-test
      - name: Verify legacy LithTech IntersectSegment ABI structs
        shell: bash
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -I server-tools/server-tools-source/src \
            server-tools/server-tools-source/tests/test_coop_intersect_abi.c -o /tmp/kpc-intersect-abi-test
          /tmp/kpc-intersect-abi-test
      - name: Validate build integrity
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('server-tools')
          binary=root/'KPCServerTools.dll'
          manifest=json.loads((root/'SERVER_TOOLS_BUILD.json').read_text())
          assert binary.read_bytes()[:2]==b'MZ', 'Expected Windows PE DLL'
          assert len(binary.read_bytes())==manifest['proxy_bytes']
          assert hashlib.sha256(binary.read_bytes()).hexdigest()==manifest['proxy_sha256']
          assert 'bac7696bc79f10b637134b7bbffea1ead01e67c8207452f5c3f339a8b5a353d4' in manifest['previous_proxy_hashes']
          assert '9b6bd69e894925e6b31f1ed32b6ff82331af104e2c20fbb6aeb43dc4bef5be9a' in manifest['previous_proxy_hashes']
          assert '66653630a0b717a70c3dd51a3b97efd75bd9b20495bd0b4d089b914b60942a37' in manifest['previous_proxy_hashes']
          assert 'c2486afa934b7216486891dc640929018ec02cdd4341734c9adc7889bff94c3b' in manifest['previous_proxy_hashes']
          assert '354a75a1d56968a69ab47539a715f805c210fdcddab02ec0aa0c2fa93ceacd2b' in manifest['previous_proxy_hashes']
          print('PASS:', binary.stat().st_size, 'bytes;', manifest['proxy_sha256'])
          PY
          objdump -p server-tools/KPCServerTools.dll | grep -A12 'Export Table'
      - name: Stage experimental test-only package
        shell: bash
        run: |
          mkdir -p dist
          cp server-tools/KPCServerTools.dll server-tools/SERVER_TOOLS_BUILD.json dist/
          cat > dist/TEST-INSTRUCTIONS.txt <<'TXT'
          KPCFIX CO-OP INTERSECTSEGMENT DIFFERENTIAL TEST - EXPERIMENTAL
          Branch: feature/coop-campaign. Not a stable release.

          Earlier test found hit=0 at ALL THREE navigable R1M2B spawns.
          Disassembly of the game's original object.lto at RVA 0xf2f7c
          proves it writes WORD 0x6003 to query+0x30. Our old diagnostic
          left that 16-bit field zero. Its meaning is still unknown.
          This build compares FOUR read-only probes at each known spawn:

          mode 0: flags=5, +0x30=0,      from Y+64  to Y-256 (old control)
          mode 1: flags=5, +0x30=0x6003, from Y+64  to Y-256 (native word)
          mode 2: flags=4, +0x30=0x6003, from Y+64  to Y-256 (world only)
          mode 3: flags=5, +0x30=0x6003, from Y+192 to Y-2048 (long ray)

          At most 12 read-only segment queries total (4 * 3 spawns).
          Hit=1 alone DOES NOT certify a full player body can fit.

          INSTALL
          1. Close the dedicated server and game.
          2. Back up server.dll, KPCServerTools.dll,
             SERVER_TOOLS_BUILD.json and KPCServerTools.ini.
          3. Extract KPCServerTools.dll and SERVER_TOOLS_BUILD.json to
             the game folder; do not overwrite original server DLL/map.
          4. Run your existing Setup-KPCServerTools.cmd.
          5. In KPCServerTools.ini use:
               [ServerTools]
               Enabled=1
               AllowCheats=0

               [Coop]
               TrialSeparateSpawns=1
               TraceSpawns=1
               TraceCollisionABI=1

          TEST
          1. Set maxclients=3 and load worlds\\realm1\\R1M2B.
          2. Connect no more than three clients once each.
          3. Confirm all three players can move and survive normally.
          4. Upload all [KPCFix Co-op] ray m=... log lines, and
             [KPCFix Co-op] ray+ m=... details if any hit.
          5. Stop testing if a client/server crashes or hangs.

          FOR SAFETY
          - This is strictly a private three-client test build, not a
            universal spawn or collision fix.
          - The existing hard-coded positions are unchanged.
          - It does not modify the engine's collisions or telefragging.
          - Turn TraceCollisionABI=0 and restart to disable extra rays.
          - Never test a fourth player or reconnect with new object
            pointers after all three trial slots have been filled.

          ROLLBACK
          Stop server and restore ALL four backed-up files including
          the old working server.dll. Do NOT replace only the build
          manifest and re-run setup: the previous manifest may reject
          the experimental DLL hash.

          No original proprietary game binaries or maps are included.
          TXT
      - name: Verify packaged INI example meets launcher contract
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          instruction=(pathlib.Path('dist')/'TEST-INSTRUCTIONS.txt').read_text()
          default=pathlib.Path('server-tools/KPCServerTools-default.ini').read_text()
          readme=pathlib.Path('server-tools/README-Server-Tools.md').read_text()
          assert 'AllowCheats=0' in default, 'Default INI must include launcher-required AllowCheats'
          assert 'AllowCheats=0' in instruction, 'Experimental test instructions omitted AllowCheats'
          assert 'AllowCheats=0' in readme, 'Documentation omitted AllowCheats'
          print('PASS: launcher-required AllowCheats present in defaults, docs and test package')
          PY
      - name: Upload local-test files
        uses: actions/upload-artifact@v4
        with:
          name: KPCFix-Coop-CollisionABI-Differential-Test
          path: dist/
          if-no-files-found: error
          retention-days: 14
