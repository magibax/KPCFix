name: Experimental co-op three-player spawn trial build

on:
  push:
    branches:
      - feature/coop-campaign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify build-tool availability
        run: gcc --version && as --version | head -1 && objcopy --version | head -1 && ld -V | head -8
      - name: Build server proxy and refreshed manifest
        run: python3 server-tools/server-tools-source/build_dll.py
      - name: Run asset-free co-op tests
        run: python3 -m unittest discover -s coop/tools -p 'test_*.py' -v
      - name: Run native 3-player spawn slot unit tests
        shell: bash
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -I server-tools/server-tools-source/src \
            server-tools/server-tools-source/tests/test_coop_spawn.c -o /tmp/kpc-coop-spawn-test
          /tmp/kpc-coop-spawn-test
      - name: Verify fail-closed general allocator policy
        shell: bash
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -I server-tools/server-tools-source/src \
            server-tools/server-tools-source/tests/test_coop_allocator.c -o /tmp/kpc-coop-allocator-test
          /tmp/kpc-coop-allocator-test
      - name: Validate build integrity
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('server-tools')
          binary=root/'KPCServerTools.dll'
          manifest=json.loads((root/'SERVER_TOOLS_BUILD.json').read_text())
          assert binary.read_bytes()[:2]==b'MZ', 'Expected Windows PE DLL'
          assert len(binary.read_bytes())==manifest['proxy_bytes']
          assert hashlib.sha256(binary.read_bytes()).hexdigest()==manifest['proxy_sha256']
          assert 'bac7696bc79f10b637134b7bbffea1ead01e67c8207452f5c3f339a8b5a353d4' in manifest['previous_proxy_hashes']
          assert '9b6bd69e894925e6b31f1ed32b6ff82331af104e2c20fbb6aeb43dc4bef5be9a' in manifest['previous_proxy_hashes']
          assert '66653630a0b717a70c3dd51a3b97efd75bd9b20495bd0b4d089b914b60942a37' in manifest['previous_proxy_hashes']
          print('PASS:', binary.stat().st_size, 'bytes;', manifest['proxy_sha256'])
          PY
          objdump -p server-tools/KPCServerTools.dll | grep -A12 'Export Table'
      - name: Stage experimental test-only package
        shell: bash
        run: |
          mkdir -p dist
          cp server-tools/KPCServerTools.dll server-tools/SERVER_TOOLS_BUILD.json dist/
          cat > dist/TEST-INSTRUCTIONS.txt <<'TXT'
          KPCFIX CO-OP THREE-PLAYER SPAWN TRIAL (EXPERIMENTAL)
          Branch: feature/coop-campaign. Not a stable release.

          Original KISS: Psycho Circus dedicated server 1.13 required.
          Player 1: (1600, -256, -2944) — previously tested
          Player 2: (1600, -256, -2848) — previously tested
          Player 3: (1600, -256, -3040) — NOT YET COLLISION-TESTED

          WARNING: Set server maxclients=3 before testing.
          This build reserves only three player-object pointers. More than
          three unique pointers (including a reconnect that reallocates one)
          are NOT supported; original fallback could telefrag another player.
          No reservation recycling or map-transition support is implemented.
          This trial is exclusive to the exact R1M2B start point. The
          original spawn/telefrag engine remains active.
          DO NOT use on a public server or with unsaved multiplayer progress.

          INSTALL
          1. Close game and server.
          2. Back up these four game-directory files:
             server.dll, KPCServerTools.dll, SERVER_TOOLS_BUILD.json,
             KPCServerTools.ini.
          3. Extract KPCServerTools.dll and SERVER_TOOLS_BUILD.json from
             this archive to your KPC game folder, overwriting those two
             files only. Do not replace the original server.original.dll
             or object.lto.
          4. Run your existing Setup-KPCServerTools.cmd.
          5. In KPCServerTools.ini use:
                [ServerTools]
                Enabled=1

                [Coop]
                TraceSpawns=1
                TrialSeparateSpawns=1
          6. In the game server launcher/rules, SET MAX PLAYERS TO 3.
          7. Start R1M2B and JOIN THREE CLIENTS ONCE, IN ORDER.
          8. Check all three can move, remain alive, and avoid solid
             walls/floor voids and unintended triggers. Report any damage
             or scripted sequence activation on spawn.
          9. Do not test reconnects with a fourth distinct object pointer
             yet: allocation reclamation has not been implemented.
          10. Send KPCServerTools.log and relevant server console output.

          To disable the trial, set TrialSeparateSpawns=0 and restart the
          server; TraceSpawns=1 alone leaves spawn positions unchanged.
          To roll back, stop the server and restore all four backed-up
          files, including server.dll. Do NOT restore only the old manifest
          and rerun setup: it may reject the experimental proxy hash.

          No copyrighted original game assets are included.
          TXT
      - name: Upload local-test files
        uses: actions/upload-artifact@v4
        with:
          name: KPCFix-Coop-Three-Player-SpawnTrial
          path: dist/
          if-no-files-found: error
          retention-days: 14
