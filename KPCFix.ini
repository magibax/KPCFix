; KPCFix for Windows. Restart client.exe after editing.
[KPCFix]
; Apply game fixes after checking both 1.13 binaries. Set to 0 for input forwarding only.
Enabled=1
; Append the detected shell, applied fixes and any errors to KPCFix.log.
Log=1

; MASTER MOUSE SWITCH. 0 = KPCFix mouse (default). 1 = original game mouse.
; Stock mode restores the engine clock and sensitivity range, shows the original
; Input Rate slider, and lets the game read and save the user's chosen rate.
; A previously saved rate of zero can be changed using the restored slider.
; HUD, timing, movement and multiplayer fixes have their own code paths.
StockMouse=0

; The following mouse options apply when StockMouse=0.
; Use the finer input clock and guard delayed and zero-length event intervals.
InputClock=1
; 10 gives sensitivity 0.01 to 2.0; 100 gives the original 0.1 to 20 range.
SensitivityRangePercent=10
; Keep the console value, numeric binding and profile setting for InputRate at zero.
LockInputRate=1
; Hide the locked slider and close the gap beneath it in the settings menu.
HideInputRate=1
; Update autoexec.cfg and existing Profiles/*.cfg. First edits create .kpc-inputrate.bak.
; Set to 0 for the runtime lock alone. This option requires LockInputRate=1.
NormalizeInputRateConfigs=1
; Set the Developer game setting to 1 in default.cfg, autoexec.cfg and
; existing Profiles/*.cfg when the setup script runs. Set to 0 to preserve their values.
ForceDeveloper=1
; Minimum single-player/local-server simulation step in ms (1-50; 0 = off).
; Shorter frames are carried into the next step, so game time stays real time
; while rendering continues at any FPS. 16 (one 60 Hz frame) fixes AI that
; stalls above 60 FPS, e.g. the R2M2A Ballbuster garage scene (user-confirmed).
LocalServerMinStepMs=16
; Do not type the console key's own character (' on UK keyboards) into the
; console when it opens. 0 = stock.
ConsoleKeyFix=1

[HUD]
; 150 at 1920x1080 gives the same proportions as the original HUD at 1280x720.
; 100 = stock HUD; 200 = double the pixel dimensions (e.g. 2560x1440).
ScalePercent=150

[Cursor]
; 0 follows HUD.ScalePercent. Specify 100 for the original cursor size.
ScalePercent=0

[Tooltip]
; 0 follows HUD.ScalePercent. Specify 100 for the original tooltip font and lift.
ScalePercent=0

[Multiplayer]
; An empty local bind IP selects 0.0.0.0. Allows joining a server from a fresh menu.
EmptyBindIPFix=1
; Set to 1 with Log=1 for socket diagnostics in KPCFix.log.
NetTrace=0
; Co-op campaign worlds (R?M?...): show the game's original loading picture while
; the world loads, for at least CampaignLoadingMinimumMs (0-30000). Deathmatch,
; menus and single player are unchanged. Set to 0 for the stock black screen.
CampaignLoadingArt=1
CampaignLoadingMinimumMs=5000
; While that picture is up, hold the player out of the world (the client only
; tells the server it is ready once the minimum time has passed), so nobody is
; attacked or stuck behind the picture. 0 = enter as soon as the world loads.
CampaignLoadingHoldSpawn=1
; In a multiplayer world, report a lost server after this many seconds without
; packets (native "disconnected" message and menu). 0 = stock 120 s; 5-120.
ServerTimeoutSeconds=15
; Keep running when the window loses focus (alt-tab, minimise), in every
; mode: sounds, music and a single-player game are not paused. 0 = stock pause.
; This is the default; in game, Setup > Audio > "Keep Running When Minimised"
; or "KeepAudioOnFocusLoss 0" (or 1) in the console switches it.
KeepAudioOnFocusLoss=1
; When the window comes back, restart kept sounds at the point they would
; have reached in real time (narration back in sync). 0 = off.
ResyncAudioOnFocus=1
; While it keeps running, the renderer also stays up: the game draws and
; animates exactly as when focused, but keyboard and mouse are released.
; 0 = stock renderer shutdown on focus loss (try this if the picture is
; broken after returning to the game).
KeepRendererOnFocusLoss=1
; How long chat and server messages stay on screen, in seconds (1-60).
; Stock: 3. Messages that carry their own time keep it.
ChatMessageSeconds=8
; While you type a chat message, keys bound to actions (noclip, invulnerability,
; movement, fire...) do nothing, so letters in the message cannot toggle cheats.
ChatBlocksActions=1
; Log (KPCFix.log) the first window breaks of a session and whether the window
; reached this client (multiplayer shard diagnosis). 0 = off.
LogWindowBreaks=1
; Hide a broken window on this client as soon as its shards are built (no
; window left standing among its own shards in multiplayer). 0 = stock.
HideBrokenWindow=1
; Multiplayer cutscenes: the server sends camera positions about 60 times a
; second; smooth the camera between them at your frame rate. 0 = stock.
SmoothCutsceneCamera=1

[AspectRatio]
; Centre fullscreen movies at 4:3. Set to 0 for original stretched playback.
Cinematics4x3=1
; Smooth movies only while Cinematics4x3 is enabled. Set to 0 for point filtering.
CinematicFilter=1
