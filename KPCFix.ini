; KPCFix for Windows. Restart client.exe after editing.
[KPCFix]
; Apply game fixes after checking both 1.13 binaries. Set to 0 for input forwarding only.
Enabled=1
; Append the detected shell, applied fixes and any errors to KPCFix.log.
Log=1

; MASTER MOUSE SWITCH. 0 = KPCFix mouse (default). 1 = original game mouse.
; Stock mode restores the engine clock and sensitivity range, shows the original
; Input Rate slider, and lets the game read and save the user's chosen rate.
; A previously saved rate of zero can be changed using the restored slider.
; HUD, timing, movement and multiplayer fixes have their own code paths.
StockMouse=0

; The following mouse options apply when StockMouse=0.
; Use the finer input clock and guard delayed and zero-length event intervals.
InputClock=1
; 10 gives sensitivity 0.01 to 2.0; 100 gives the original 0.1 to 20 range.
SensitivityRangePercent=10
; Keep the console value, numeric binding and profile setting for InputRate at zero.
LockInputRate=1
; Hide the locked slider and close the gap beneath it in the settings menu.
HideInputRate=1
; Update autoexec.cfg and existing Profiles/*.cfg. First edits create .kpc-inputrate.bak.
; Set to 0 for the runtime lock alone. This option requires LockInputRate=1.
NormalizeInputRateConfigs=1
; Set the Developer game setting to 1 in default.cfg, autoexec.cfg and
; existing Profiles/*.cfg when the setup script runs. Set to 0 to preserve their values.
ForceDeveloper=1

[HUD]
; 150 at 1920x1080 gives the same proportions as the original HUD at 1280x720.
; 100 = stock HUD; 200 = double the pixel dimensions (e.g. 2560x1440).
ScalePercent=150

[Cursor]
; 0 follows HUD.ScalePercent. Specify 100 for the original cursor size.
ScalePercent=0

[Tooltip]
; 0 follows HUD.ScalePercent. Specify 100 for the original tooltip font and lift.
ScalePercent=0

[Multiplayer]
; An empty local bind IP selects 0.0.0.0. Allows joining a server from a fresh menu.
EmptyBindIPFix=1
; Set to 1 with Log=1 for socket diagnostics in KPCFix.log.
NetTrace=0

[AspectRatio]
; Centre fullscreen movies at 4:3. Set to 0 for original stretched playback.
Cinematics4x3=1
; Smooth movies only while Cinematics4x3 is enabled. Set to 0 for point filtering.
CinematicFilter=1
