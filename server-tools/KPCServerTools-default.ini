[ServerTools]
; 1 = server hooks active, 0 = original engine pass-through. Restart to change.
Enabled=1
; The launcher inserts this key on older INIs if missing; retain for clarity.
; Initial permission at server startup; kpc_cheats 0/1 changes it live.
AllowCheats=0

[Coop]
; Experimental diagnostics: log the original campaign spawn position call without moving players.
; Requires a development server DLL, not the tagged stable R3 release. Restart to change.
TraceSpawns=0
; EXPERIMENTAL: three-player test exclusively at the exact R1M2B start coordinate.
; Set server maxclients=3 before using this; do not allow a fourth client.
; Player 2 is offset by +96 Z, player 3 by -96 Z (both live-tested on R1M2B).
; These fixed positions are NOT collision validated; disable after the test and restart.
TrialSeparateSpawns=0

; DIAGNOSTIC ONLY: four read-only segment-query variants at each of three R1M2B trial spots.
; Compares original +0x30=0x6003 against previous zero field, flags and ray range.
; Does not validate full player volume or change world/player positions.
; Requires a diagnostic-capable 1.13 development DLL and restart. Max 12 probes.
TraceCollisionABI=0

; One player on R1M2B. Sample three positions and a wall control on first anchor spawn.
; Reads player bounds and logs fail-closed volume verdicts.
; Ray misses remain UNSUPPORTED until full-hull/actor APIs are verified.
TracePlayerClearance=0

; EXPERIMENTAL read-only primary BSP whole-player-box differential on R1M2B.
; Implicitly enables TracePlayerClearance. Requires exact original 1.13 server DLL
; hash; emits INTERIOR_ONLY / TOUCHES_CLASS_ZERO / UNKNOWN for four locations.
; INTERIOR_ONLY is NOT a spawn clearance verdict: moving WorldModels and
; active players are not covered. Disabled by default. Restart to change.
TraceBspVolume=0

; EXPERIMENTAL: inventory the named WorldModel *resource registry* in original
; 1.13 on the first R1M2B player start. No engine methods are called.
; The count of resource entries and root pointers is NOT a count of live,
; collidable WorldModel objects; transforms and flags remain unverified.
; Includes read-only reciprocal model/object pointer consistency counts.
; A matching back-reference is NOT proof the object is active or solid.
; Implies TracePlayerClearance, requires original DLL hash, restarts to apply.
TraceModelRegistry=0

; EXPERIMENTAL: read-only raw type/flags/initial-vector survey for only the
; reciprocally consistent model-linked objects. Requires TraceModelRegistry=1
; and the hash-matched original 1.13 DLL. The raw 0x28 flag masks are not
; proof of solidity; vector equivalence is NOT a valid BSP transform.
; No player/object position or world geometry is changed. Restart to apply.
TraceModelState=0
; Log authored intro lookup and entry into the mode-gated exit handler.
TraceCampaign=0

; EXPERIMENTAL co-op MVP session (protocol kpc-coop/1). 0 = off. The launcher
; "co-op" checkbox sets this to 1 for that start and back to 0 for normal starts.
; Chat lobby (!ready/!start), fixed R1M2B -> R1M2C -> R1M3A route, R1M2B fixed
; placements, no telefrag between players, server-coordinated exits. Experimental.
CoopSession=0
; Players required before the host can !start (1-3).
CoopMinPlayers=2
; Session capacity (1-3). Keep the server maxclients at or below this value.
CoopMaxPlayers=3
; 0 = change world without the multiplayer scoreboard (no click needed).
; 1 = native intermission scoreboard that waits for a player's fire/use.
CoopIntermission=0
; 1 = deliver each world's original music start (song, transition, intensity) to
;     every player once per map, after that player spawns. 0 = stock behaviour.
CoopMusic=1
; EXPERIMENTAL: play the original starting_cinematic once for the whole session
; when every player has entered the world (R1M3A only for now). 0 = skipped.
CoopIntro=0
; Script clock for that intro: 1 = never let the original script clock run
; ahead of real time (the dedicated server credits each 8 ms frame as 10 ms,
; so scripted subtitles and events outran the streamed narration). 0 = engine
; frame time (stock). Empty/absent = same as CoopIntro.
;CoopScriptClock=1
; Sound timers (session): 1 = the server times sounds on real time, so long
; narration is not dropped early (the dedicated server credits 8 ms frames as
; 10 ms and removed the 44 s R1M3A narration after ~36 s). Europe-family
; server.dll only. 0 = engine frame time. Empty/absent = same as CoopScriptClock.
;CoopSoundClock=1
; 1 = show the stock scoreboard to every player from !start until the intro
;     cinematic begins (no click needed; closed automatically). Requires
;     CoopIntermission=0. 0 = no scoreboard at !start.
CoopStartScoreboard=1
; 1 = original enemy health bars in co-op (server values, sent 10x per second).
CoopHealthBars=1
; 1 = create the map's authored monster spawners (e.g. R1M3A spawn6 after the
;     window smash). Stock multiplayer never creates them. 0 = stock.
CoopSpawners=1
; Session: players start at the world's single-player start (where the
;     campaign puts you), not at deathmatch starts some worlds also have
;     (R1M1A, R1M1B). Players share that point until the collision-checked
;     allocator exists. 0 = stock multiplayer starts.
CoopSinglePlayerStart=1
; Session: run the single-player script events the engine skips in multiplayer
;     ("player ..." commands for every player, disable_ai, wake_monster_group,
;     disable targetting, cheatscript). 0 = stock.
CoopScriptEvents=1
; Session: minimum server simulation step in ms (0-50; 0 = stock 8 ms frames
;     simulated as 10 ms). 16 = one 60 Hz frame: game time is real time and
;     AI/physics behave as at 60 FPS (R2M2A Ballbuster garage scene).
CoopServerFrameMs=16
; Session: weapons, armour, pamphlets, keys and tickets picked up by one player
;     are given to everyone; "secret found" is shown to everyone. 0 = stock.
CoopSharedItems=1
; Session: a player whose start point is already taken spawns at a nearby spot
;     the engine checks first (clear line, floor, body clear of walls); else
;     the start is shared. 0 = everyone at the start.
CoopSpawnSpread=1
; Session: 0 = players cannot hurt each other (self and monster damage as
;     normal). 1 = stock friendly fire.
CoopFriendlyFire=0
; Server difficulty for spawners/monsters: 0 Lullaby, 1 Daydream, 2 Sleepless,
; 3 Cold Sweat, 4 Nightmare. Empty/absent = unchanged (dedicated server: 0).
;CoopSkill=2
; Diagnostic: log the monster spawner filter (first 64) and per-world counts.
TraceSpawners=0
; Diagnostic (session only): log script starts (switches, triggers, script
;     objects, "scriptplay"), scripts refused as already running or not
;     loaded, and switches reaching their "on" state.
TraceScripts=0
; EXPERIMENTAL campaign graph (requires CoopSession=1). 0 = fixed MVP route
; R1M2B > R1M2C > R1M3A. 1 = the 48 worlds of the original WORLDORDER.TXT. The
;     host starts at once with !campaign full (whole game from R1M0) or
;     !campaign water|earth|air|fire|nightmare (or 1-5): start at that realm and
;     carry on to the end. Natural exits must lead to the WORLDORDER successor;
;     !abort (host) and completion return to the lobby world.
CoopCampaign=0
; Lobby world after completion or !abort, e.g. worlds\realm1\R1M2B. Empty =
; R1M2B.
CoopLobbyWorld=
; Session + CoopIntro: every route world plays its starting_cinematic (the
;     R1M1A intro also loads the level's lever/door scripts). Default: on with
;     CoopCampaign=1, off on the MVP route. Add CoopIntroAll=0 to play only the
;     verified intros (R?M0, R1M3A).
; CoopIntroSettleMs: wait after the last player has spawned before the intro
;     starts. Default 0 with CoopCampaign=1 (KPCFix clients hold their
;     spawn behind the loading picture), 3000 otherwise.
; TEST ONLY: route world that !start loads (R1M2B, R1M2C or R1M3A). Empty = R1M2B.
CoopTestStartWorld=
; Diagnostics (session only): log each world's music event creation, and add
; t=<ms since session armed> to co-op log lines. Restart to change.
TraceMusic=0
TraceTiming=0
