[ServerTools]
; 1 = server hooks active, 0 = original engine pass-through. Restart to change.
Enabled=1
; Initial permission at server startup; kpc_cheats 0/1 changes it live.
AllowCheats=0
; Minimum server simulation step in ms (1-50; 0 = original engine timing).
; The original server steps 10 ms every ~8 ms (game time ~1.25x real time),
; which stalls some AI, e.g. the Ballbuster in the R2M2A garage door.
; Europe, German and Italian server.dll only; the USA server is unchanged.
ServerFrameMs=16
